# Supabase pauses a Free project after about a week with too little database activity, and then
# the site's photo sections come up empty. This asks the database for one row twice a day, the
# same kind of request the site makes, so the project never looks idle.
#
# If the project does get paused anyway, this job fails (the address stops resolving) and GitHub
# emails you: resume it from the Supabase dashboard.
#
# Note: GitHub turns off scheduled workflows in a repository with no commits for 60 days; pushing
# anything (or "Enable workflow" on the Actions tab) turns it back on.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 4,16 * * *"   # twice a day (UTC)
  workflow_dispatch:           # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: [.github/workflows/keep-supabase-awake.yml]   # once when this file changes

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one photo row
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          code=$(curl -sS --retry 3 --retry-delay 20 -o body.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/photos?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY") || true
          code=${code:-000}
          echo "Supabase answered HTTP $code"
          head -c 200 body.json 2>/dev/null; echo
          if [ "$code" != "200" ]; then
            echo "::error::Supabase did not answer (HTTP $code). If the project is paused, resume it from the Supabase dashboard."
            exit 1
          fi
